<% require 'json' %>
default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV['POSTGRES_POOL'] %>
  username: <%= ENV['POSTGRES_USER'] %>
  password: <%= ENV.fetch('POSTGRES_PASSWORD', '').to_json %>
  host: <%= ENV['POSTGRES_HOST'] %>
  port: <%= ENV.fetch("POSTGRES_PORT", "5432") %>

development:
  <<: *default
  database: skylark_development

test:
  <<: *default
  database: skylark_test

production:
  <<: *default
  database: skylark_production
