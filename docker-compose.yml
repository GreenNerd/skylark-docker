x-skylark-image: &skylark_image
  image: registry.cn-hangzhou.aliyuncs.com/skylark/production:${SLP_VERSION:?Set SLP_VERSION in .env}
  platform: ${SLP_PLATFORM:-linux/amd64}

services:
  db:
    container_name: 'slp_postgresql'
    image: postgres:16-alpine
    env_file:
      - app.default.env
      - app.local.env
    volumes:
      - ./data/postgresql:/var/lib/postgresql/data
    expose:
      - '5432'
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d skylark_production"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: on-failure:1

  redis:
    container_name: 'slp_redis'
    image: redis:7.4-alpine
    volumes:
      - ./data/redis:/data
    expose:
      - '6379'
    restart: on-failure:1

  elasticsearch:
    container_name: 'slp_elasticsearch'
    image: bill1997603/elasticsearch-ik:8.19.20
    environment:
      - discovery.type=single-node
      - http.host=0.0.0.0
      - transport.host=127.0.0.1
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms2g -Xmx2g
    volumes:
      - ./data/elasticsearch:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9200/_cluster/health?wait_for_status=yellow&timeout=3s"]
      interval: 10s
      timeout: 5s
      retries: 20
    expose:
      - '9200'
      - '9300'
    restart: on-failure:1

  web:
    <<: *skylark_image
    container_name: 'slp_web'
    env_file:
      - app.default.env
      - app.local.env
    depends_on:
      app:
        condition: service_started
      sidekiq:
        condition: service_started
      rustfs:
        condition: service_healthy
    command: /bin/bash /etc/nginx/start
    volumes:
      - ./etc/nginx/nginx.conf:/etc/nginx/nginx.conf
      - ./etc/nginx/start:/etc/nginx/start
      - ./etc/nginx/skylark:/etc/nginx/skylark
      - ./etc/nginx/skylark-http.conf.erb:/tmp/skylark-http.conf.erb
      - ./etc/nginx/skylark-https.conf.erb:/tmp/skylark-https.conf.erb
      - ./etc/ssl:/etc/ssl
      - ./tmp/pids:/var/www/pids
      - ./log:/var/www/log
      - ./shared/public/assets:/var/www/skylark/public/assets
      - ./shared/public/packs:/var/www/skylark/public/packs
      - ./shared/public/exportable_files:/var/www/skylark/public/exportable_files
      - ./shared/public/uploads:/var/www/skylark/public/uploads
    ports:
      - '80:80'
      - '443:443'
    restart: on-failure:1

  app: &app_base
    <<: *skylark_image
    env_file:
      - app.default.env
      - app.local.env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      elasticsearch:
        condition: service_healthy
    volumes:
      - ./config/cable.yml:/var/www/skylark/config/cable.yml
      - ./config/chewy.yml:/var/www/skylark/config/chewy.yml
      - ./config/database.yml:/var/www/skylark/config/database.yml
      - ./config/redis.yml:/var/www/skylark/config/redis.yml
      - ./config/secrets.yml:/var/www/skylark/config/secrets.yml
      - ./config/settings.yml:/var/www/skylark/config/settings.yml
      - ./config/storage.yml:/var/www/skylark/config/storage.yml
      - ./config/sidekiq.yml:/var/www/skylark/config/sidekiq.yml
      - ./tmp:/var/www/skylark/tmp
      - ./log:/var/www/skylark/log
      - ./tmp/pids:/var/www/pids
      - ./shared/public/assets:/var/www/skylark/public/assets
      - ./shared/public/packs:/var/www/skylark/public/packs
      - ./shared/public/exportable_files:/var/www/skylark/public/exportable_files
      - ./shared/public/uploads:/var/www/skylark/public/uploads
      - ./shared/uploads:/var/www/skylark/uploads
    command: bundle exec puma -C config/puma.rb
    expose:
      - '3000'
    restart: on-failure:1

  sidekiq:
    <<: *app_base
    container_name: 'slp_sidekiq'
    command: bundle exec sidekiq -C config/sidekiq.yml
    expose: []

  rustfs:
    image: rustfs/rustfs:1.0.6
    entrypoint:
      - /bin/sh
      - -ec
      - |
        if [ -z "$${RUSTFS_ACCESS_KEY:-}" ] || [ -z "$${RUSTFS_SECRET_KEY:-}" ] ||
           [ "$$RUSTFS_ACCESS_KEY" = rustfsadmin ] || [ "$$RUSTFS_SECRET_KEY" = rustfsadmin ]; then
          echo 'Set non-default RUSTFS_ACCESS_KEY and RUSTFS_SECRET_KEY in rustfs.local.env' >&2
          exit 1
        fi
        exec /etc/rustfs/entrypoint.sh rustfs
    env_file:
      - rustfs.local.env
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - ./data/rustfs:/data
    ports:
      - "${RUSTFS_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_API_PORT:-9000}:9000"
      - "${RUSTFS_BIND_ADDRESS:-127.0.0.1}:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: on-failure:1
